[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resume-optimizer-mcp"
version = "0.1.0"
description = "Optional MCP server for the Resume Optimizer Claude Skill — PDF parsing and (future) DOCX, JD matching, gap analysis."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Resume Optimizer Contributors" }
]
keywords = ["mcp", "claude", "resume", "ats", "skill"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "mcp>=1.0.0",
  "pydantic>=2.0",
  "pypdf>=4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]

[project.scripts]
resume-optimizer-mcp = "resume_optimizer_mcp.server:main"

[project.urls]
Homepage = "https://github.com/Sumukhmg/resume-optimizer-claude-skill"
Issues = "https://github.com/Sumukhmg/resume-optimizer-claude-skill/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/resume_optimizer_mcp"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
