name: Feature request
description: Suggest a new capability for the Resume Optimizer skill, MCP server, or docs.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Please describe the use case before the
        implementation — we want to make sure the feature solves a real
        problem before we discuss how to build it.

        For **new keyword additions**, please use the "New keywords" issue
        template instead.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: |
        Describe the user scenario where the current skill falls short.
        Avoid prescribing the solution here — we'll discuss the how next.
      placeholder: As a <type of user>, I want to <goal> because <reason>.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What do you propose?
      description: One or two ways the project could solve the problem above.
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: Which part of the project does this touch?
      multiple: true
      options:
        - Skill body (SKILL.md)
        - Rules / rubric / templates (resources/)
        - Keyword vocabularies (resources/keywords/)
        - Examples (examples/)
        - MCP server (mcp-server/)
        - Documentation (docs/, README)
        - Tests (tests/)
        - CI / release
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why this one is better.
